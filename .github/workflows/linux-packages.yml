name: Linux packages
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  source:
    name: Verify and prepare shared source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test core and data tools
        run: |
          python3 tooling/development.py
          cargo fmt --check
          cargo fmt --check --manifest-path src-voice/Cargo.toml
          CARGO_TARGET_DIR="$PWD/target" cargo test --locked --features native-ffi
          CARGO_TARGET_DIR="$PWD/target" cargo test --locked --manifest-path src-voice/Cargo.toml
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 -m unittest discover -s src-voice/paraformer/tests -p 'test_*.py'
          python3 -m unittest discover -s src-model-tools/text-models -p 'test_*.py'
      - name: Prepare pinned offline inputs
        run: |
          python3 src-data-tools/dictionaries/manage.py build-default --source-cache build/review --output build/data
          cargo vendor --locked --versioned-dirs --manifest-path src-voice/Cargo.toml build/voice-vendor
          python3 tooling/package_arch.py
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-source
          path: |
            dist/cowtype-*-source.tar.gz
            dist/PKGBUILD
          if-no-files-found: error
  packages:
    name: Package ${{ matrix.distro }} ${{ matrix.arch }}
    needs: source
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {distro: arch, image: 'archlinux:latest', format: arch, arch: x86_64, runner: ubuntu-24.04}
          - {distro: fedora45, image: 'fedora:45', format: rpm, arch: x86_64, runner: ubuntu-24.04}
          - {distro: debianunstable, image: 'debian:unstable', format: deb, arch: x86_64, runner: ubuntu-24.04}
          - {distro: opensusetumbleweed, image: 'opensuse/tumbleweed:latest', format: rpm, arch: x86_64, runner: ubuntu-24.04}
          - {distro: fedora45, image: 'fedora:45', format: rpm, arch: arm64, runner: ubuntu-24.04-arm}
          - {distro: debianunstable, image: 'debian:unstable', format: deb, arch: arm64, runner: ubuntu-24.04-arm}
          - {distro: ubuntu26.04, image: 'ubuntu:26.04', format: deb, arch: x86_64, runner: ubuntu-24.04}
          - {distro: ubuntu26.04, image: 'ubuntu:26.04', format: deb, arch: arm64, runner: ubuntu-24.04-arm}
          - {distro: deepin23, image: 'linuxdeepin/deepin:23', format: deb, arch: x86_64, runner: ubuntu-24.04}
          - {distro: deepin25, image: 'linuxdeepin/deepin:25', format: deb, arch: x86_64, runner: ubuntu-24.04}
          - {distro: deepin25, image: 'linuxdeepin/deepin:crimson-arm64', format: deb, arch: arm64, runner: ubuntu-24.04-arm}
          - {distro: opensuseleap16.0, image: 'registry.opensuse.org/opensuse/leap:16.0', format: rpm, arch: x86_64, runner: ubuntu-24.04}
          - {distro: openkylin, image: 'openkylin/openkylin:latest', format: deb, arch: x86_64, runner: ubuntu-24.04}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: bash tooling/ci-linux.sh dependencies '${{ matrix.distro }}'
      - uses: actions/download-artifact@v4
        with:
          name: prepared-source
          path: dist
      - run: bash tooling/ci-linux.sh build '${{ matrix.distro }}' '${{ matrix.format }}'
      - run: bash tooling/ci-linux.sh verify '${{ matrix.distro }}'
        env:
          COWTYPE_VOICE_HELPER: ${{ github.workspace }}/tests/native/fake-voice.py
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.distro }}-${{ matrix.arch }}
          path: dist/packages/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.distro }}-${{ matrix.arch }}
          path: |
            build/ci-test/Testing/Temporary/LastTest.log
            build/ci-ldd.txt
  loongarch:
    name: Package deepin25 loongarch64
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: loong64
      - uses: actions/download-artifact@v4
        with:
          name: prepared-source
          path: dist
      - name: Start Deepin LoongArch64 container
        run: |
          docker run --detach --name cowtype-loongarch --platform linux/loong64 \
            --volume "$PWD:/work" --workdir /work linuxdeepin/deepin:crimson-loong64 sleep infinity
      - name: Install native dependencies and compiler
        run: docker exec cowtype-loongarch bash tooling/ci-linux.sh dependencies deepin25
      - name: Build, test and package
        run: docker exec cowtype-loongarch bash tooling/ci-linux.sh build deepin25 deb
      - name: Install and verify native package
        run: docker exec --env COWTYPE_VOICE_HELPER=/work/tests/native/fake-voice.py cowtype-loongarch bash tooling/ci-linux.sh verify deepin25
      - uses: actions/upload-artifact@v4
        with:
          name: package-deepin25-loongarch64
          path: dist/packages/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-deepin25-loongarch64
          path: |
            build/ci-test/Testing/Temporary/LastTest.log
            build/ci-ldd.txt
      - name: Remove isolated container
        if: always()
        run: docker rm --force cowtype-loongarch || true
