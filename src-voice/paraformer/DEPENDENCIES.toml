# Integration dependency declarations; deliberately not a standalone Cargo.toml.
# Re-resolve transitive dependencies in the independent implementation workspace.
[dependencies]
anyhow = "1"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "api-22"] }
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
